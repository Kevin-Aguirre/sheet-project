name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd api && go vet ./...
      - run: cd api && go test ./...

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd worker && pip install -e ".[dev]"
      - run: cd worker && python -m pytest tests/ -v || true

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: [test-api, test-worker, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sheetflow-api:${{ github.sha }} ./api
      - name: Build Worker image
        run: docker build -t sheetflow-worker:${{ github.sha }} ./worker
      - name: Build Frontend image
        run: docker build -t sheetflow-frontend:${{ github.sha }} ./frontend

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ./helm/sheetflow
      - run: helm template sheetflow ./helm/sheetflow
