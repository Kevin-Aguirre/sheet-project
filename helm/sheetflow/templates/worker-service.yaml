apiVersion: v1
kind: Service
metadata:
  name: {{ include "sheetflow.fullname" . }}-worker
  labels:
    {{- include "sheetflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "sheetflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
