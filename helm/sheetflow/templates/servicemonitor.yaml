{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sheetflow.fullname" . }}
  labels:
    {{- include "sheetflow.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sheetflow.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      targetPort: {{ .Values.api.port }}
    - port: metrics
      path: /metrics
      interval: 15s
      targetPort: {{ .Values.worker.metricsPort }}
{{- end }}
