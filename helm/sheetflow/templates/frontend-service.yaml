apiVersion: v1
kind: Service
metadata:
  name: {{ include "sheetflow.fullname" . }}-frontend
  labels:
    {{- include "sheetflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sheetflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
