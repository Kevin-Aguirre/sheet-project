apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sheetflow.fullname" . }}-worker
  labels:
    {{- include "sheetflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "sheetflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "sheetflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "sheetflow.fullname" . }}
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          ports:
            - containerPort: {{ .Values.worker.metricsPort }}
              name: metrics
          envFrom:
            - configMapRef:
                name: {{ include "sheetflow.fullname" . }}-config
            - secretRef:
                name: {{ include "sheetflow.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
